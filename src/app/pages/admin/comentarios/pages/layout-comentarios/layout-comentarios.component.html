<app-navbar-admin></app-navbar-admin>
<app-portada></app-portada>

<div class="container my-4">
  <!-- Loader -->
  <div *ngIf="loading" class="d-flex justify-content-center py-5">
    <div class="spinner-border text-primary" role="status" aria-label="Cargando opiniones"></div>
  </div>

  <!-- Grid -->
  <div *ngIf="!loading">
    <div class="row g-3">
      <!-- 1 col en xs, 2 en md, 3 en lg+ -->
      <div class="col-12 col-md-6 col-lg-4" *ngFor="let op of opiniones; let i = index">
        <app-comentarios [opinion]="op"></app-comentarios>
      </div>
    </div>

    <!-- Estado vacío -->
    <div *ngIf="!opiniones?.length" class="text-center text-muted py-5">
      No hay opiniones para mostrar.
    </div>
  </div>
</div>

<app-footer-admin></app-footer-admin>
