<form [formGroup]="proveedorForm" (ngSubmit)="guardar()">
  <div class="row g-3">

    <div class="col-md-6">
      <label class="form-label">Nombre</label>
      <input
        type="text"
        formControlName="nombre"
        class="form-control"
        [ngClass]="{ 'is-invalid': isInvalid('nombre') }"
      />
      <div *ngIf="isInvalid('nombre')" class="invalid-feedback">
        El nombre es obligatorio y máximo 25 caracteres.
      </div>
    </div>

    <div class="col-md-6">
      <label class="form-label">Teléfono</label>
      <input
        type="text"
        formControlName="telefono"
        class="form-control"
        [ngClass]="{ 'is-invalid': isInvalid('telefono') }"
      />
      <div *ngIf="isInvalid('telefono')" class="invalid-feedback">
        Ingresa un número válido de 10 dígitos.
      </div>
    </div>

    <div class="col-md-6">
      <label class="form-label">Correo electrónico</label>
      <input
        type="email"
        formControlName="correoElectronico"
        class="form-control"
        [ngClass]="{ 'is-invalid': isInvalid('correoElectronico') }"
      />
      <div *ngIf="isInvalid('correoElectronico')" class="invalid-feedback">
        Ingresa un correo válido (máximo 50 caracteres).
      </div>
    </div>

    <div class="col-md-6">
      <label class="form-label">Contacto</label>
      <input
        type="text"
        formControlName="contacto"
        class="form-control"
        [ngClass]="{ 'is-invalid': isInvalid('contacto') }"
      />
      <div *ngIf="isInvalid('contacto')" class="invalid-feedback">
        Máximo 50 caracteres.
      </div>
    </div>

    <div class="col-12">
      <label class="form-label">Descripción del servicio</label>
      <textarea
        rows="3"
        formControlName="descripcionServicio"
        class="form-control"
        [ngClass]="{ 'is-invalid': isInvalid('descripcionServicio') }"
      ></textarea>
      <div *ngIf="isInvalid('descripcionServicio')" class="invalid-feedback">
        Máximo 100 caracteres.
      </div>
    </div>
  </div>

  <div class="d-flex justify-content-center mt-4 gap-2">
    <button type="submit" class="btn btn-primary">
      <i class="bi bi-check-circle me-1"></i> {{ proveedor ? 'Actualizar' : 'Guardar' }}
    </button>
    <button type="button" class="btn btn-outline-secondary" (click)="cancelar()">
      <i class="bi bi-x-circle me-1"></i> Cancelar
    </button>
  </div>
</form>
