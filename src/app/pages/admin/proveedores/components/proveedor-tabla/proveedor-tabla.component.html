<div class="container py-4">

  <!-- Encabezado con búsqueda y botón -->
  <div *ngIf="mostrarFormulario" class="d-flex justify-content-between align-items-center mb-3 flex-wrap gap-2">
    <div class="flex-grow-1 me-2">
      <input
        type="text"
        class="form-control"
        placeholder="Buscar proveedor por nombre"
        [(ngModel)]="filtro"
        (input)="filtrarProveedores()"
      />
    </div>

    <button class="btn" [ngClass]="mostrarFormulario ? 'btn-secondary' : 'btn-custom'" (click)="toggleFormulario()">
      <i class="bi bi-plus-circle me-1"></i>
      {{ mostrarFormulario ? 'Cancelar' : 'Nuevo Proveedor' }}
    </button>
  </div>

  <!-- Formulario visible -->
  <div *ngIf="mostrarFormulario" class="mb-4">
    <app-proveedor-formulario (onProveedorCreado)="onProveedorCreado()"></app-proveedor-formulario>
  </div>

  <!-- Tabla visible solo si no se muestra el formulario -->
  <div class="table-responsive" *ngIf="!mostrarFormulario">
    <table class="table table-hover table-bordered align-middle thead-azul">
      <thead>
        <tr>
          <th>Nombre</th>
          <th>Teléfono</th>
          <th>Correo</th>
          <th>Contacto</th>
          <th>Descripción</th>
          <th>Estatus</th>
          <th>Acciones</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let proveedor of proveedoresFiltrados">
          <td>{{ proveedor.nombre }}</td>
          <td>{{ proveedor.telefono }}</td>
          <td>{{ proveedor.correoElectronico }}</td>
          <td>{{ proveedor.contacto }}</td>
          <td>{{ proveedor.descripcionServicio }}</td>
          <td>
            <span class="badge" [ngClass]="proveedor.estatus ? 'bg-success' : 'bg-danger'">
              {{ proveedor.estatus ? 'Activo' : 'Inactivo' }}
            </span>
          </td>
          <td>
            <button class="btn btn-sm btn-warning me-1">
              <i class="bi bi-pencil-square"></i>
            </button>
            <button class="btn btn-sm btn-danger">
              <i class="bi bi-trash"></i>
            </button>
          </td>
        </tr>
        <tr *ngIf="proveedoresFiltrados.length === 0">
          <td colspan="7" class="text-center">No hay proveedores coincidentes.</td>
        </tr>
      </tbody>
    </table>
  </div>
</div>
