<section class="products-hero">
  <div class="container h-100">
    <div class="row h-100 align-items-center">
      <div class="col-lg-6 text-white">
        <h1 class="display-5 fw-bold mb-4">Dashboard IntelliSoft</h1>
        <p class="lead mb-4">Tecnología integrada para agricultura sostenible</p>
      </div>
    </div>
  </div>
</section>

<div class="dashboard-container">
  <!-- Contenido Principal -->
  <main class="main-content">

    <!-- Gráficos y Datos -->
    <section class="data-section">
      <div class="chart-card">
        <div class="card-header d-flex justify-content-between align-items-center">
          <h3>Pedidos por Estatus</h3>
        </div>
        <div class="chart-container fix-overflow">
          <canvas baseChart
            [data]="pedidosChartData"
            [labels]="pedidosChartLabels"
            [options]="chartOptions">
          </canvas>
        </div>
      </div>

      <div class="chart-card">
        <div class="card-header d-flex justify-content-between align-items-center">
          <h3>Opiniones por Calificación</h3>
        </div>
        <div class="chart-container fix-overflow">
          <canvas baseChart
            [data]="opinionesChartData"
            [labels]="opinionesChartLabels"
            [options]="chartOptions">
          </canvas>
        </div>
      </div>
      
      <div class="chart-card">
        <div class="card-header d-flex justify-content-between align-items-center">
          <h3>Productos Más Vendidos</h3>
        </div>
        <div class="chart-container fix-overflow">
          <canvas baseChart
            [data]="productosVendidosChartData"
            [type]="productosVendidosChartType"
            [options]="chartOptions">
          </canvas>
        </div>
      </div>
      
      <div class="chart-card">
        <div class="card-header d-flex justify-content-between align-items-center">
          <h3>Productos Mejor Calificados</h3>
        </div>
        <div class="chart-container fix-overflow">
          <canvas baseChart
            [data]="productosCalificadosChartData"
            [options]="chartOptions">
          </canvas>
        </div>
      </div>
    </section>
  </main>
</div>
