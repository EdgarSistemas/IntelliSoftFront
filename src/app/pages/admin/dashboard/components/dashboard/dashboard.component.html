<section class="products-hero">
  <div class="container h-100">
    <div class="row h-100 align-items-center">
      <div class="col-lg-6 text-white">
        <h1 class="display-5 fw-bold mb-4">Dashboard IntelliSoft</h1>
        <p class="lead mb-4">Tecnología integrada para agricultura sostenible</p>
      </div>
    </div>
  </div>
</section>

<div class="dashboard-container">
  <!-- Contenido Principal -->
  <main class="main-content">
    <!-- Métricas Rápidas -->
    <section class="metrics-grid">
      <div class="metric-card">
        <div class="metric-icon bg-primary-light">
          <i class="bi bi-tree text-primary"></i>
        </div>
        <div class="metric-info">
          <h3>24</h3>
          <p>Invernaderos activos</p>
        </div>
      </div>
      <div class="metric-card">
        <div class="metric-icon bg-success-light">
          <i class="bi bi-currency-dollar text-success"></i>
        </div>
        <div class="metric-info">
          <h3>$128,450</h3>
          <p>Ventas este mes</p>
        </div>
      </div>
      <div class="metric-card">
        <div class="metric-icon bg-warning-light">
          <i class="bi bi-people text-warning"></i>
        </div>
        <div class="metric-info">
          <h3>42</h3>
          <p>Nuevos clientes</p>
        </div>
      </div>
      <div class="metric-card">
        <div class="metric-icon bg-danger-light">
          <i class="bi bi-exclamation-triangle text-danger"></i>
        </div>
        <div class="metric-info">
          <h3>5</h3>
          <p>Alertas activas</p>
        </div>
      </div>
    </section>

    <!-- Gráficos y Datos -->
    <section class="data-section">
      <div class="chart-card">
        <div class="card-header d-flex justify-content-between align-items-center">
          <h3>Pedidos por Estatus</h3>
        </div>
        <div class="chart-container fix-overflow">
          <canvas baseChart
            [data]="pedidosChartData"
            [labels]="pedidosChartLabels"
            [options]="chartOptions">
          </canvas>
        </div>
      </div>

      <div class="chart-card">
        <div class="card-header d-flex justify-content-between align-items-center">
          <h3>Opiniones por Calificación</h3>
        </div>
        <div class="chart-container fix-overflow">
          <canvas baseChart
            [data]="opinionesChartData"
            [labels]="opinionesChartLabels"
            [options]="chartOptions">
          </canvas>
        </div>
      </div>
      
      <div class="chart-card">
        <div class="card-header d-flex justify-content-between align-items-center">
          <h3>Productos Más Vendidos</h3>
        </div>
        <div class="chart-container fix-overflow">
          <canvas baseChart
            [data]="productosVendidosChartData"
            [options]="chartOptions">
          </canvas>
        </div>
      </div>
      
      <div class="chart-card">
        <div class="card-header d-flex justify-content-between align-items-center">
          <h3>Productos Mejor Calificados</h3>
        </div>
        <div class="chart-container fix-overflow">
          <canvas baseChart
            [data]="productosCalificadosChartData"
            [options]="chartOptions">
          </canvas>
        </div>
      </div>
    </section>
  </main>
</div>
