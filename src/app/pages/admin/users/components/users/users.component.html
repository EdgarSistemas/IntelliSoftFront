<div class="container-fluid p-5 mb-5 portada">
    <div class="container">
        <h1 class="display-5 fw-bold">Panel de Administración</h1>
        <p class="fs-4">Gestiona tus comentarios y preguntas</p>
    </div>
</div>


<div class="container mt-5">
  <div class="card shadow-sm">
    <div class="card-header bg-white border-0 d-flex justify-content-between align-items-center">
      <h5 class="mb-0">Lista de Usuarios</h5>
      <div class="d-flex gap-3">
        <div class="input-group input-group-sm" style="width: 200px;">
          <input 
            type="text" 
            class="form-control" 
            placeholder="Buscar..." 
            [(ngModel)]="searchTerm" 
            (input)="onSearchChange()"
          >
          <span class="input-group-text bg-white">
            <i class="bi bi-search"></i>
          </span>
        </div>
        
        <select 
          class="form-select form-select-sm" 
          style="width: 180px;"
          [(ngModel)]="selectedRole" 
          (change)="onRoleChange()"
        >
          <option *ngFor="let option of roleOptions" [value]="option.value">
            {{ option.label }}
          </option>
        </select>
      </div>
    </div>
    
    <div class="card-body">
      <div *ngIf="loading" class="text-center py-5">
        <div class="spinner-border text-primary" role="status">
          <span class="visually-hidden">Cargando...</span>
        </div>
      </div>

      <div *ngIf="!loading && filteredUsers.length === 0" class="text-center py-5">
        <p>No se encontraron usuarios</p>
      </div>

      <div *ngIf="!loading && filteredUsers.length > 0" class="table-container">
        <table class="table table-hover mb-0">
          <thead>
            <tr>
              <th scope="col">Nombre</th>
              <th scope="col">Apellidos</th>
              <th scope="col">Email</th>
              <th scope="col">Rol</th>
              <th scope="col" class="text-end">Acciones</th>
            </tr>
          </thead>
          <tbody>
            <tr *ngFor="let user of filteredUsers">
              <td>{{ user.nombre }}</td>
              <td>{{ user.apellidos }}</td>
              <td>{{ user.email }}</td>
              <td>
                <span class="badge" [ngClass]="{
                  'bg-primary': user.rol === 'admin',
                  'bg-success': user.rol === 'cliente',
                  'bg-secondary': user.rol === 'anonimo'
                }">
                  {{ user.rol }}
                </span>
              </td>
              <td class="text-end">
                 <button (click)="editarUsuario(user)" class="btn btn-sm btn-outline-primary">
  <i class="bi bi-pencil"></i> Editar
</button>
                <button (click)="deleteUser(user.id)" class="btn btn-sm btn-outline-danger">
                  <i class="bi bi-trash"></i> Eliminar
                </button>
              </td>
            </tr>
          </tbody>
        </table>
      </div>
      
      <div *ngIf="!loading" class="mt-3 text-end text-muted small">
        Mostrando {{ filteredUsers.length }} de {{ users.length }} usuarios
      </div>
    </div>
  </div>
</div>
