<form [formGroup]="insumoForm" (ngSubmit)="guardar()">
  <div class="mb-3">
    <label class="form-label">Nombre</label>
    <input
      type="text"
      formControlName="nombre"
      class="form-control"
      [class.is-invalid]="campoInvalido('nombre')"
      placeholder="Nombre del insumo"
    />
    <div class="invalid-feedback">El nombre es obligatorio y máximo 25 caracteres.</div>
  </div>

  <div class="mb-3">
    <label class="form-label">Descripción</label>
    <textarea
      formControlName="descripcion"
      class="form-control"
      [class.is-invalid]="campoInvalido('descripcion')"
      placeholder="Descripción del insumo"
      rows="2">
    </textarea>
    <div class="invalid-feedback">La descripción es obligatoria y máximo 100 caracteres.</div>
  </div>

  <div class="mb-3" *ngIf="!insumo">
    <label class="form-label">Unidad de medida</label>
    <select
      formControlName="unidadId"
      class="form-select"
      [class.is-invalid]="campoInvalido('unidadId')">
      <option value="" disabled selected>Selecciona una unidad...</option>
      <option *ngFor="let u of unidades" [value]="u.idUnidad">
        {{ u.nombre }} ({{ u.simbolo }})
      </option>
    </select>
    <div class="invalid-feedback">Debes seleccionar una unidad válida.</div>
  </div>

  <div class="d-flex justify-content-center mt-4 gap-2">
    <button type="submit" class="btn btn-primary">
      <i class="bi bi-check-circle me-1"></i>{{ insumo ? 'Actualizar' : 'Guardar' }}
    </button>
    <button type="button" class="btn btn-outline-secondary me-2" (click)="cancelar()"><i class="bi bi-x-circle me-1"></i>Cancelar</button>
  </div>
</form>
