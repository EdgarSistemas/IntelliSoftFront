<div class="card-body" [formGroup]="formulario">
  <!-- Nombre y descripción -->
  <div class="row mb-3">
    <div class="col-md-6">
      <label class="form-label">Nombre del producto</label>
      <input type="text" class="form-control" formControlName="nombre" placeholder="Nombre del producto" />
    </div>
    <div class="col-md-6">
      <label class="form-label">Descripción</label>
      <input type="text" class="form-control" formControlName="descripcion" placeholder="Descripción del producto" />
    </div>
  </div>

  <!-- Hectárea base, % ganancia, % riesgo -->
  <div class="row mb-3">
    <div class="col-md-4">
      <label class="form-label">Hectárea base</label>
      <input type="number" class="form-control" formControlName="hectareaBase" min="0.01" step="0.01" />
    </div>
    <div class="col-md-4">
      <label class="form-label">% Ganancia</label>
      <input type="number" class="form-control" formControlName="porcentajeGanancia" min="0" step="0.01" />
    </div>
    <div class="col-md-4">
      <label class="form-label">% Riesgo</label>
      <input type="number" class="form-control" formControlName="porcentajeRiesgo" min="0" step="0.01" />
    </div>
  </div>

  <!-- Agregar insumo -->
  <div class="mb-3">
    <label class="form-label">Agregar Insumo</label>
    <div class="row g-2">
      <div class="col-md-6">
        <input
          type="text"
          class="form-control"
          [ngModel]="nombreInsumoSeleccionado"
          (ngModelChange)="onInsumoInput($event)"
          [ngModelOptions]="{ standalone: true }"
          list="insumoList"
          placeholder="Busca o selecciona un insumo" />
        <datalist id="insumoList">
          <option *ngFor="let i of insumos" [value]="i.nombre"></option>
        </datalist>
      </div>
      <div class="col-md-4">
        <input type="number" class="form-control" placeholder="Cantidad" [(ngModel)]="cantidadInsumo"
               [ngModelOptions]="{ standalone: true }" min="0.01" step="0.01" />
      </div>
      <div class="col-md-2">
        <button class="btn btn-success w-100" (click)="agregarInsumo()" [disabled]="!puedeAgregarInsumo()">
          <i class="bi bi-plus"></i>
        </button>
      </div>
    </div>
  </div>

  <!-- Tabla de insumos agregados -->
  <div class="table-responsive" *ngIf="insumosAgregados.length > 0">
    <table class="table table-sm align-middle">
      <thead class="table-light">
        <tr>
          <th>Insumo</th>
          <th class="text-center">Cantidad</th>
          <th>Unidad</th>
          <th class="text-end">Acciones</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let insumo of insumosAgregados">
          <td>{{ obtenerNombreInsumo(insumo.insumoId) }}</td>
          <td class="text-center">{{ insumo.cantidad }}</td>
          <td>{{ obtenerUnidadInsumo(insumo.insumoId) }}</td>
          <td class="text-end">
            <button class="btn btn-sm btn-outline-danger" (click)="eliminarInsumo(insumo.insumoId)">
              <i class="bi bi-trash"></i>
            </button>
          </td>
        </tr>
      </tbody>
    </table>
  </div>

  <!-- Botones -->
  <div class="mt-4 d-flex justify-content-center gap-2">
    <button class="btn btn-primary" type="button" (click)="guardarProducto()"
            [disabled]="!formulario.valid || insumosAgregados.length === 0">
      <i class="bi bi-check-circle me-1"></i>Guardar
    </button>
    <button class="btn btn-outline-secondary" type="button" (click)="cancelar()">
      <i class="bi bi-x-circle me-1"></i>Cancelar
    </button>
  </div>
</div>
