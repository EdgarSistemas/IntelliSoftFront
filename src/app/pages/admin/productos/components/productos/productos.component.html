<div class="container-fluid p-5 mb-5 portada">
    <div class="container">
        <h1 class="display-5 fw-bold">Panel de Administración</h1>
        <p class="fs-4">Gestiona tus comentarios y preguntas</p>
    </div>
</div>

<div class="container mt-5">
<h2>Productos Activos</h2>
<div class="row mt-3" *ngFor="let producto of productos">
<div class="col-md-12">
<div class="card">
<div class="card-header">
{{producto.nombre}}
</div>
<div class="card-body">
<p>Precio: {{producto.precio | currency}}</p>
<p>Descripción: {{producto.descripcion}}</p>
<button class="btn btn-primary" (click)="editarProducto(producto)">Editar</button>
<button class="btn btn-danger" (click)="eliminarProducto(producto)">Eliminar</button>
</div>
</div>
</div>
</div>
<button class="btn btn-primary mt-3" routerLink="/nuevo-producto">Agregar Producto</button>
</div>
