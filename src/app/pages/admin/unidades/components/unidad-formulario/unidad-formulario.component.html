<form [formGroup]="unidadForm" (ngSubmit)="guardar()">
  <div class="row g-3">
    <div class="col-md-6">
      <label class="form-label">Nombre</label>
      <input type="text" formControlName="nombre" class="form-control" [ngClass]="{ 'is-invalid': isInvalid('nombre') }" />
      <div *ngIf="isInvalid('nombre')" class="invalid-feedback">Máximo 25 caracteres.</div>
    </div>

    <div class="col-md-6">
      <label class="form-label">Símbolo</label>
      <input type="text" formControlName="simbolo" class="form-control" [ngClass]="{ 'is-invalid': isInvalid('simbolo') }" />
      <div *ngIf="isInvalid('simbolo')" class="invalid-feedback">Máximo 5 caracteres.</div>
    </div>

    <div class="col-12">
      <label class="form-label">Descripción</label>
      <textarea formControlName="descripcion" rows="3" class="form-control" [ngClass]="{ 'is-invalid': isInvalid('descripcion') }"></textarea>
      <div *ngIf="isInvalid('descripcion')" class="invalid-feedback">Máximo 100 caracteres.</div>
    </div>
  </div>

  <div class="d-flex justify-content-center mt-4 gap-2">
    <button type="submit" class="btn btn-primary">
      <i class="bi bi-check-circle me-1"></i> {{ unidad ? 'Actualizar' : 'Guardar' }}
    </button>
    <button type="button" class="btn btn-secondary" (click)="cancelar()">
      <i class="bi bi-x-circle me-1"></i> Cancelar
    </button>
  </div>
</form>
