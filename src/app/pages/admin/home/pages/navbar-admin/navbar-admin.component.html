<nav class="navbar navbar-expand-lg fixed-top p-1 navbar-scroll" id="mainNavbar" [class.scrolled]="scrolled">

      <img
        src="img/logo_1.jpg"
        height="60"
        alt="IntelliSoft"
        loading="lazy"
        rel="preload"
        style="margin-top: -7px; border-radius: 15px 15px 15px 15px"
      />
    </a>
    <div class="collapse navbar-collapse" id="navbarButtonsExample">
      <div class="d-flex align-items-end a-nav">
        <div class="collapse navbar-collapse" id="navbarNav">
             <ul class="navbar-nav">
              <li class="nav-item me-4">
                <a class="nav-link text-dark text-scroll" routerLink="/admin/dashboard" routerLinkActive="active-link">Dashboard</a>
              </li>
              <li class="nav-item me-4">
                <a class="nav-link text-dark text-scroll" routerLink="/admin/unidades" routerLinkActive="active-link">Unidades</a>
              </li>
              <li class="nav-item">
                <a class="nav-link me-4 text-dark text-scroll" routerLink="/admin/proveedores" routerLinkActive="active-link">Proveedores</a>
              </li>
              <li class="nav-item">
                <a class="nav-link me-4 text-dark text-scroll" routerLink="/admin/insumos" routerLinkActive="active-link">Insumos</a>
              </li>
              <li class="nav-item">
                <a class="nav-link me-4 text-dark text-scroll" routerLink="/admin/comentarios" routerLinkActive="active-link">Comentarios</a>
              </li>
              <li class="nav-item">
                <a class="nav-link me-4 text-dark text-scroll" routerLink="/admin/compras" routerLinkActive="active-link">Compras</a>
              </li>
              <li class="nav-item">
                <a class="nav-link me-4 text-dark text-scroll" routerLink="/admin/productos" routerLinkActive="active-link">Productos</a>
              </li>
              <li class="nav-item">
                <a class="nav-link me-4 text-dark text-scroll" routerLink="/admin/users" routerLinkActive="active-link">Usuarios</a>
              </li>
              <li class="nav-item">
                <a class="nav-link me-4 text-dark text-scroll" routerLink="/admin/ventas" routerLinkActive="active-link">Ventas</a>
              </li>
            </ul>
        </div>

        <!-- Botón Iniciar Sesión -->
        <button
          data-mdb-ripple-init
          data-mdb-ripple-color="dark"
          type="button"
          class="btn btn-outline-primary btn-scroll me-4"
          *ngIf="!auth.isAuthenticated()"
          routerLink="/login">
          Iniciar sesión
        </button>

        <div class="dropdown" *ngIf="auth.isAuthenticated()">
          <button
            class="btn btn-light dropdown-toggle d-flex align-items-center"
            type="button"
            id="dropdownUserButton"
            data-bs-toggle="dropdown"
            aria-expanded="false">
            <i class="bi bi-person-circle fs-5 me-1"></i>
          </button>
          <ul class="dropdown-menu dropdown-menu-end shadow" aria-labelledby="dropdownUserButton">
            <li>
              <a class="dropdown-item" routerLink="/perfil">
                <i class="bi bi-person me-2"></i> Perfil
              </a>
            </li>
            <li>
              <button class="dropdown-item" (click)="auth.logout()">
                <i class="bi bi-box-arrow-right me-2"></i> Cerrar sesión
              </button>
            </li>
          </ul>
        </div>
