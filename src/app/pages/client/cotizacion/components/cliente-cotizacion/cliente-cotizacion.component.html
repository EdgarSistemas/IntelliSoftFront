<div class="row justify-content-center mt-5"> <!-- Eliminado d-none -->
  <div class="col-lg-12"> <!-- Aumenté el tamaño para coincidir con tu diseño deseado -->
    <div class="card hover-lift border-0 shadow-sm"> <!-- Añadí clases de estilo -->
      <div class="card-header bg-primary text-white py-4"> <!-- Añadí header como en tu diseño -->
        <div class="d-flex justify-content-between align-items-center">
          <h3 class="mb-0">Realiza tu cotización</h3>
        </div>
      </div>
      
      <div class="card-body p-4 p-lg-5">
        <form [formGroup]="formularioCotizacion" (ngSubmit)="enviarCotizacion()">
          <input type="hidden"  />
          
          <div class="mb-4">
            <h5 class="d-flex align-items-center mb-4">
              <div class="icon-box bg-primary bg-opacity-10 text-primary rounded me-3">
                <i class="bi bi-box-seam fs-4"></i>
              </div>
              Selecciona tus productos
            </h5>
            
            <div class="row g-4">
              <div *ngFor="let producto of productos" class="col-md-4">
                <div class="card h-100" [class.border-primary]="productoIdSeleccionado === producto.idProductos">
                  <div class="card-body text-center">
                    <h5 class="card-title">{{producto.nombre}}</h5>
                    <p class="text-muted small">{{producto.descripcion}}</p>
                    <button type="button" 
                            class="btn btn-sm"
                            [class.btn-primary]="productoIdSeleccionado === producto.idProductos"
                            [class.btn-outline-primary]="productoIdSeleccionado !== producto.idProductos"
                            (click)="seleccionarProducto(producto)">
                      {{productoIdSeleccionado === producto.idProductos ? 'Seleccionado' : 'Seleccionar'}}
                    </button>
                  </div>
                </div>
              </div>
            </div>
          </div>

          <div class="row g-4">
            <div class="col-md-6">
              <label class="form-label fw-semibold">Hectáreas</label>
              <input type="number" class="form-control" formControlName="hectareas"
                    [class.is-invalid]="formularioCotizacion.get('hectareas')?.invalid && formularioCotizacion.get('hectareas')?.touched">
              <div *ngIf="formularioCotizacion.get('hectareas')?.invalid && formularioCotizacion.get('hectareas')?.touched" 
                   class="invalid-feedback">
                Mínimo 1 hectárea
              </div>
            </div>
            
            <div class="col-12">
              <label class="form-label fw-semibold">Detalles adicionales</label>
              <textarea class="form-control" rows="3" formControlName="detalles"></textarea>
            </div>
          </div>

          <div class="d-flex justify-content-end pt-4 mt-3 border-top">
            <button type="submit" class="btn btn-primary" [disabled]="formularioCotizacion.invalid || !productoIdSeleccionado">
              <i class="bi bi-send me-2"></i> Enviar Cotización
            </button>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
