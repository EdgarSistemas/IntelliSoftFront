<div class="container">
  <div id="formulario-registro" class="row justify-content-center">
    <div class="col-lg-6">
      <div class="register-card" data-aos="zoom-in">
        <div class="text-center mb-4">
          <h3 class="fw-light text-dark mb-2">Ingresa tus datos</h3>
          <p class="text-muted">y genera tu cotización</p>
        </div>
        <form [formGroup]="formulario" (ngSubmit)="registrarUsuario()">
          <div class="form-group mb-3">
            <div class="input-field">
              <input type="text" formControlName="nombre" required />
              <label>Nombre</label>
              <span class="focus-border"></span>
            </div>
          </div>
          <div class="form-group mb-3">
            <div class="input-field">
              <input type="text" formControlName="apellidos" required />
              <label>Apellidos</label>
              <span class="focus-border"></span>
            </div>
          </div>
          <div class="form-group mb-3">
            <div class="input-field">
              <input type="email" formControlName="email" required />
              <label>Correo electrónico</label>
              <span class="focus-border"></span>
            </div>
          </div>
          <div class="d-grid gap-2 mt-4">
            <button
              type="submit"
              class="btn btn-futurist"
              [disabled]="formulario.invalid"
            >
              Continuar
            </button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <div id="formulario-cotizacion" class="row justify-content-center d-none">
    <div class="col-lg-6">
      <div class="card" data-aos="zoom-in">
        <div class="text-center mb-4">
          <h3 class="fw-light text-dark mb-2">Realiza tu cotización</h3>
          <p class="text-muted">Selecciona los productos y completa los detalles</p>
        </div>
        <form [formGroup]="formularioCotizacion" (ngSubmit)="enviarCotizacion()">
          <input type="hidden" formControlName="idUsuario" />
          <div class="form-group mb-3">
              <div class="form-group mb-3">
    <label>Productos</label>
    <div class="row">
      <div *ngFor="let producto of productos" class="col-md-4 mb-3">
        <div class="card" [class.border-primary]="productoIdSeleccionado === producto.idProductos">
          <div class="card-body">
            <h5>{{producto.nombre}}</h5>
            <button type="button" 
                    class="btn btn-primary"
                    (click)="seleccionarProducto(producto)">
              {{productoIdSeleccionado === producto.idProductos ? 'Seleccionado' : 'Seleccionar'}}
            </button>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

          <div class="form-group mb-3">
            <label for="hectareas">Hectáreas</label>
            <input
              type="number"
              id="hectareas"
              class="form-control"
              formControlName="hectareas"
            />
          </div>

          <div class="form-group mb-3">
            <label for="detalles">Detalles de la cotización</label>
            <textarea
              id="detalles"
              class="form-control"
              formControlName="detalles"
              rows="3"
            ></textarea>
          </div>

          <div class="d-grid gap-2 mt-4">
            <button type="submit" class="btn btn-primary">
              Enviar Cotización
            </button>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
