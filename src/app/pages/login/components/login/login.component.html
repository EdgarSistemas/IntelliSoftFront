<div class="login-container d-flex justify-content-center align-items-center min-vh-100">
  <div class="login-card">
    <div class="text-center mb-4">
      <img src="./img/logo.png" alt="IntelliSoft" width="100" class="mb-3">
      <h4 class="fw-light text-dark mb-2 display-4">IntelliSoft</h4>
      <p class="text-muted medium">Tecnología e innovación</p>
    </div>

    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
      <!-- Email -->
      <div class="mb-3">
        <input
          type="email"
          formControlName="email"
          class="form-control form-control-lg border-0 border-bottom"
          placeholder="Correo electrónico"
          [ngClass]="{ 'is-invalid': submitted && f['email'].errors }"
        />
        <div class="invalid-feedback small" *ngIf="submitted && f['email'].errors">
          <div *ngIf="f['email'].errors?.['required']">Correo requerido</div>
          <div *ngIf="f['email'].errors?.['email']">Formato inválido</div>
        </div>
      </div>

      <!-- Contraseña -->
      <div class="mb-4">
        <input
          type="password"
          formControlName="password"
          class="form-control form-control-lg border-0 border-bottom"
          placeholder="Contraseña"
          [ngClass]="{ 'is-invalid': submitted && f['password'].errors }"
        />
        <div class="invalid-feedback small" *ngIf="submitted && f['password'].errors">
          Contraseña requerida
        </div>
      </div>

      <!-- Botón -->
      <div class="d-grid mb-3">
        <button class="btn btn-primary py-2" [disabled]="loading">
          <span *ngIf="!loading">Acceder</span>
          <span *ngIf="loading">
            <span class="spinner-border spinner-border-sm me-2"></span>
            Ingresando...
          </span>
        </button>
      </div>

      <!-- Enlaces -->
      <div class="text-center small mt-4">
        <a href="#" class="text-muted text-decoration-none">
          ¿Olvidaste tu contraseña?
        </a>
      </div>

      <!-- Mensaje de error -->
      <div class="alert alert-light mt-4 p-2 border text-center small" *ngIf="errorMessage">
        <i class="bi bi-exclamation-circle me-1"></i> {{ errorMessage }}
      </div>
    </form>
  </div>
</div>
